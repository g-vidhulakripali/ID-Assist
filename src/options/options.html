<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ID Assist settings</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, "Segoe UI", sans-serif; font-size: 14px; }
      body { margin: 0; padding: 16px 20px; min-width: 320px; }
      h1 { font-size: 16px; margin: 0 0 12px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin: 0 0 14px; }
      .row { display: flex; align-items: center; gap: 8px; }
      .hint { color: GrayText; font-size: 12px; margin: 0; }
      select { font: inherit; padding: 4px 6px; }
      kbd { font-family: ui-monospace, monospace; border: 1px solid GrayText; border-radius: 4px; padding: 0 4px; }
      [role="status"] { min-height: 1.2em; font-size: 12px; color: GrayText; }
    </style>
  </head>
  <body>
    <h1>ID Assist settings</h1>

    <div class="field">
      <label class="row"><input type="checkbox" id="autoDetect" /> Offer help automatically when a form is detected</label>
      <p class="hint">When off, ID Assist only appears when you ask for it with the shortcut or the toolbar button.</p>
    </div>

    <div class="field">
      <label for="indicatorPosition">Indicator position</label>
      <select id="indicatorPosition">
        <option value="bottom-right">Bottom right</option>
        <option value="bottom-left">Bottom left</option>
        <option value="top-right">Top right</option>
        <option value="top-left">Top left</option>
      </select>
    </div>

    <div class="field">
      <span>Keyboard shortcut</span>
      <p class="hint">
        Default: <kbd id="shortcut">Alt+Shift+A</kbd>. Change it under Extensions &rarr; Keyboard shortcuts
        (type <code>edge://extensions/shortcuts</code> in the address bar).
      </p>
    </div>

    <p role="status" id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
